version: '3.8'

services:
  deploybot:
    image: ghcr.io/kletskovg/deploybot:latest
    container_name: deploybot
    ports:
      - "3000:3000"
    env_file:
      - deploybot.env
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - deploybot-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # Uncomment for persistent logs volume
    # volumes:
    #   - deploybot-logs:/app/logs

  watchtower:
    image: containrrr/watchtower:latest
    container_name: deploybot-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_ROLLING_RESTART=true
    networks:
      - deploybot-network

networks:
  deploybot-network:
    driver: bridge

# Uncomment for persistent volumes
# volumes:
#   deploybot-logs:
