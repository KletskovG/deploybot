name: CI

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create required files
        run: |
          mkdir -p .config/env
          touch .config/env/.env.production
          touch authorized_key.json

      - name: Run build
        run: make build

      - name: Type checking
        run: npm run typechecking

      - name: Lint
        run: npm run lint

      - name: Setup YDB credentials
        run: |
          echo "${{ secrets.YDB_KEY }}" | base64 -d > deployment/docker/authorized_key.json

      - name: Run tests
        run: npm run test
        env:
          YDB_CONNECTION_STRING: ${{ secrets.YDB_CONNECTION }}
          YDB_KEY_PATH: ${{ github.workspace }}/deployment/docker/authorized_key.json
